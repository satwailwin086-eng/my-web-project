<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> 
</head>
<style>
    .box1{
        background-color: silver;
        width: 1000px;
        height: 500px;
        margin: 45px auto;
    }
    .box2{
        background: linear-gradient(45deg, white, red);
        width: 200px;
        height: 200px;
        border-radius: 200px;
        position: relative;
        top: 100px;
        left: 100px;
        animation: move  3s infinite alternate;
        
    }
    .box2:hover{
        scale: 1.1;
        transition:scale 0.5s;

    }

    @keyframes move{
        0% {
            left:0;
            top:0;
        }
        50%{
            left: 400px;
            top:300px;
        }
        100%{
            left:800px;
            top:0;
        }
    }
</style>
<body>
    
        <div class="box1">
            <div class="box2"></div>
        </div>
        

</body>
</html>
