<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: auto;
        max-width: 1000px;
        font-family: sans-serif;
        font-size: 2.5em;
    }
    #button{
        font-size: 1.5em;
        background: transparent;
        border-radius: 10px;
        background-color: cornflowerblue;
        color: white;
    }
    .backdrop{
        background-color: black;
        opacity: 0.5;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
    }

    #box{
        position: absolute;
        top: -350%;
        left: 25%;
        width: 40%;
        height: 250px;
        background: #333;
        border-radius: 10px;
        transition: top 0.5s;
       
        
    }
    #box h2{
        font-family: sans-serif;
        color: white;
        background-color: black;
        margin: 0;
        padding: 20px;
        border-radius: 10px 10px 0 0;
        font-size: 1em;
        
    }

    #box h2 a{
        color: red;
        float: right;
        text-decoration: none;
    }
</style>
<body>
    <h1>CV Form</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Cupiditate animi iusto et reprehenderit ut quo nesciunt excepturi quibusdam pariatur sapiente? Excepturi adipisci deleniti veniam id fugit accusamus doloribus voluptates perferendis.</p>
    <button id="button"  onclick="alert()">Button</button>
    <div class="backdrop" onclick="hide()"></div>
    <div id="box">
        <h2>Form <a href="#" onclick="hide()">&times;</a></h2>
    </div>
    <script>
        function hide(){
            document.querySelector(".backdrop").style.display="none";
            document.querySelector("#box").style.top="-350%";

        }
        function alert(){
            document.querySelector(".backdrop").style.display="block";
            document.querySelector("#box").style.top="15%";

        }
    </script>
</body>
</html>
