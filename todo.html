<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container" style="max-width: 600px">
            <a href="#" class="navbar-brand">ToDo List <span class="badge bg-danger rounded-pill ms-2">0</span></a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px">
       <div class="input-group my-4">
           <input type="text" class="form-control">
           <button class="btn btn-dark">Add</button>
       </div>
        <ul id="todo" class="list-group"></ul>
        <ul id="done" class="list-group mt-4 opacity-50"></ul>
    
    </div>
   

    
    <script>

          let data=getdata();
          data.map(item => createitem(item.text));
           updatecount();
          function getdata(){
            return JSON.parse(localStorage.getItem("data")) || [];
          }
          function saveData(text){
            let data= getdata();
            data.push({text , done: false});
            localStorage.setItem("data", JSON.stringify(data));
          }


        function updatecount(){
            document.querySelector(".badge").textContent=
            document.querySelectorAll("#todo li").length;

        }



        document.querySelector("button").onclick =()=>{
           let text= document.querySelector("input").value;
           if(text =="")return false;
           createitem(text);
           updatecount();
           saveData(text);
           
           document.querySelector("input").value="";
           document.querySelector("input").focus();

        }

        document.querySelector("input").onkeydown= e=>{
            if(e.key=="Enter"){
                document.querySelector("button").onclick();
            }
        }

        function createitem(text){
            let li=document.createElement("li");
            li.classList.add("list-group-item");
           li.textContent=text;

           let check=document.createElement("a");
           check.setAttribute("href" , "#");
           check.classList.add("fa-solid" , "fa-check", "float-start" , "me-2");
           check.onclick = () => {
            document.querySelector("#done").appendChild(li);
            check.remove();
            updatecount();
           }
           li.appendChild(check);
           


           let del=document.createElement("a");
           del.setAttribute("href" , "#");
           del.classList.add("fa-solid", "fa-trash", "text-danger", "float-end")
           del.onclick = () =>{
            li.remove();
            updatecount();
           }

           li.appendChild(del);
           document.querySelector("#todo").appendChild(li);


        }
    </script>
</body>
</html>
