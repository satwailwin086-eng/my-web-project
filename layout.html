<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 1000px;
            
            background-color:silver;
        }
        header{
            height: 50px;
            background-color: blue;
        }
        nav{
            height: 200px;
            width: 200px;
            background-color: brown;
        }
        article{
            height: 200px;
            width: 600px;
            background-color: chocolate;
        }
        aside{
            height: 200px;
            width: 200px;
            background-color: cadetblue;
        }
        footer{
            height: 50px;
            background-color: darkmagenta;
        }
        main{
            display: flex;
        }
        @media(max-width:1000px){
            .container{
                width: 100%;
            }
            main{
                flex-wrap: wrap;
            }
            nav{
                width: 100%;
            }
            article, aside{
                width: 50%;
            }
        }
        @media(max-width: 600px){
            article, aside{
                width:100%;
            }
        }


    </style>
</head>
<body>
    <div class="container">
        <header></header>
            <main>
                <nav></nav>
                <article></article>
                <aside></aside>
             </main>
        <footer></footer>
        
    </div>
</body>
</html>
