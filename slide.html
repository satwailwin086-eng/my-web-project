<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            max-width: 800px;
            margin:  auto;
            position: relative;
        }
        .container button{
            border: 0 none;
            background: transparent;
            font-size: 2.5em;
            position: absolute;
            top:42%;


        }
        #one{
            left: 10%;
        }
         #two{
            right: 10%;
         }
        .box{
            height: 300px;
            text-align: center;
            font-size: 2.5em;
            line-height: 300px;
            color: white;
            
             }
             #box1{
                background-color: aqua;
             }
             #box2{
                background-color: blueviolet;
                display: none;
             }
             #box3{
                background-color: cadetblue;
                display: none;
             }

       
    </style>
</head>
<body>
 <div class="container">
    <button id="one" onclick="prev()">&laquo;</button>
    <button id="two" onclick="next()">&raquo;</button>

        <div class="box" id="box1">Box1</div>
        <div class="box" id="box2">Box2</div>
        <div class="box" id="box3">Box3</div>
    </div>
    <script>
        var box=1;
        setInterval(next,2000);
         function prev(){
           

            document.querySelector("#box" + box).style.display="none";
            box--;
            if(box<1) box=3;
            document.querySelector("#box" + box).style.display="block";

        }
        function next(){
           

            document.querySelector("#box" + box).style.display="none";
            box++;
            if(box>3) box=1;
            document.querySelector("#box" + box).style.display="block";

        }
    </script>
</body>
</html>
